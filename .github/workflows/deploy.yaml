name: Deploy to Server

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations and tests
        env:
          DEBUG: "True"
        run: |
          python manage.py migrate
          python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # Nach dem Umzug auf einen eigenen App-User (siehe Server-Anleitung)
          # nur die Repo-Variable APP_DIR setzen, z. B. /srv/kanmind.
          APP_DIR: ${{ vars.APP_DIR || '/home/marc/projects/kanmind' }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_DIR
          script: |
            set -e

            cd "$APP_DIR"

            echo "=== Git Pull ==="
            git fetch origin master
            git reset --hard origin/master

            echo "=== Python Setup ==="
            source venv/bin/activate
            pip install -r requirements.txt

            echo "=== Django ==="
            python manage.py migrate
            python manage.py collectstatic --noinput

            echo "=== Restart Kanmind Backend ==="
            sudo -n /usr/bin/systemctl restart kanmind

            echo "=== Fertig ==="
